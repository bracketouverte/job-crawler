services:
  eval:
    build:
      context: ./matcher
    working_dir: /app
    entrypoint: ["python", "/app/eval/eval.py"]
    environment:
      CAREER_OPS_DIR: ${CAREER_OPS_DIR:-career-ops}
    volumes:
      - ./matcher:/app
    restart: "no"

  matcher:
    build:
      context: ./matcher
    working_dir: /app
    ports:
      - "8001:8001"
    environment:
      CAREER_OPS_DIR: ${CAREER_OPS_DIR:-career-ops}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-4-maverick-17b-128e-instruct}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-}
      NVIDIA_NIM_BASE_URL: ${NVIDIA_NIM_BASE_URL:-}
      NVIDIA_CHAT_COMPLETIONS_URL: ${NVIDIA_CHAT_COMPLETIONS_URL:-}
      NVIDIA_NIM_CHAT_COMPLETIONS_URL: ${NVIDIA_NIM_CHAT_COMPLETIONS_URL:-}
      NVIDIA_ENSEMBLE_SCORERS: ${NVIDIA_ENSEMBLE_SCORERS:-}
      NVIDIA_ENSEMBLE_SYNTHESIZER: ${NVIDIA_ENSEMBLE_SYNTHESIZER:-}
      NVIDIA_DEEPSEEK_REASONING_EFFORT: ${NVIDIA_DEEPSEEK_REASONING_EFFORT:-none}
      ENSEMBLE_JOB_CONCURRENCY: ${ENSEMBLE_JOB_CONCURRENCY:-1}
    volumes:
      - ./matcher:/app
    restart: unless-stopped

  viewer:
    build:
      context: ./viewer
    depends_on:
      - scheduler
      - matcher
    env_file:
      - path: ./.env
        required: false
    ports:
      - "3000:3000"
    volumes:
      - ./crawler/state:/app/state
    environment:
      CATALOG_DB: /app/state/catalog.sqlite
      # The production image copies frontend/dist to ./static (WORKDIR
      # /app), not to a frontend/ sibling of backend/ — config.py's
      # STATIC_DIR/SAVED_SEARCHES_PATH defaults assume the dev-time
      # backend+frontend sibling layout, so both need overriding here.
      STATIC_DIR: /app/static
      SAVED_SEARCHES_PATH: /app/static/saved-searches.json
      MATCHER_SERVICE_URL: http://matcher:8001
      LOGO_DEV_PUBLISHABLE_KEY: ${LOGO_DEV_PUBLISHABLE_KEY:-}
      LOGO_DEV_SECRET_KEY: ${LOGO_DEV_SECRET_KEY:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SCORE_NOTIFY_MIN_SCORE: ${SCORE_NOTIFY_MIN_SCORE:-4}
      NVIDIA_ENSEMBLE_SCORERS: ${NVIDIA_ENSEMBLE_SCORERS:-}
      NVIDIA_ENSEMBLE_SYNTHESIZER: ${NVIDIA_ENSEMBLE_SYNTHESIZER:-}
    restart: unless-stopped

  scheduler:
    build:
      context: ./scheduler
    environment:
      - PROJECT_DIR=${PWD}
      - TZ=${TZ:-America/New_York}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro
      - ./crawler/state:/state
    restart: unless-stopped

  crawler:
    build:
      context: ./crawler
    volumes:
      - ./sources:/data/sources:ro
      - ./crawler/output:/app/output
      - ./crawler/state:/app/state
    command:
      - --concurrency
      - "8"
      - --provider-concurrency
      - ashby=1,workday=4,lever=3,teamtailor=2,bamboohr=3,greenhouse=6,workable=2,smartrecruiters=2
      - --timeout-ms
      - "30000"
      - --retries
      - "5"
      - --exclude-sources
      - /app/state/exclude.jsonl
      - --catalog-db
      - /app/state/catalog.sqlite
